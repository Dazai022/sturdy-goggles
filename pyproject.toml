[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "reposentinel-ai"
version = "0.1.0"
description = "Local-first GitHub repository security and maintenance agent"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28,<0.29",
    "pydantic-settings>=2.7,<3",
    "rich>=13.9,<16",
    "typer>=0.15,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "PyJWT>=2.10,<3",
    "cryptography>=43,<47",
]

[project.scripts]
reposentinel = "reposentinel.cli:app"

[tool.setuptools.packages.find]
include = ["reposentinel*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
